name: brewlite-ass2

services:
  # 1. PostgreSQL Database Service (Riêng biệt cho Assignment 2)
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-ass2-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_ass2_db}
    ports:
      # Map 5433 ở máy host vào 5432 container -> Không bị đụng cổng 5432 của Assignment 1!
      - "5433:5432"
    volumes:
      - brewlite_ass2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite_user -d brewlite_ass2_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brewlite-ass2-net

  # 2. NestJS Backend API Service (Assignment 2)
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: brewlite-ass2-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite_user}:${POSTGRES_PASSWORD:-brewlite_password}@postgres:5432/${POSTGRES_DB:-brewlite_ass2_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-brewlite_super_secret_jwt_key_2026}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - brewlite-ass2-net

  # 3. Next.js Mobile-first PWA Web Frontend (Assignment 2)
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: brewlite-ass2-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - brewlite-ass2-net

volumes:
  brewlite_ass2_pgdata:
    driver: local

networks:
  brewlite-ass2-net:
    driver: bridge
