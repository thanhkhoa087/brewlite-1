name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

jobs:
  quality-gate:
    name: Quality Gate (Install, Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite_user
          POSTGRES_PASSWORD: brewlite_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install Backend Dependencies & Generate Prisma Client
        working-directory: apps/api
        run: |
          npm ci
          npx prisma generate

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      # Step 1: Linter Check
      - name: Lint Backend (NestJS)
        working-directory: apps/api
        run: npm run lint

      - name: Lint Frontend (Next.js)
        working-directory: apps/web
        run: npm run lint

      # Step 2: Unit, Integration & E2E Tests
      - name: Run Backend Unit Tests
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://brewlite_user:brewlite_password@localhost:5432/brewlite_test?schema=public"
          JWT_SECRET: "ci_jwt_test_secret_key"
        run: npm test

      - name: Run Backend Integration Tests
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://brewlite_user:brewlite_password@localhost:5432/brewlite_test?schema=public"
          JWT_SECRET: "ci_jwt_test_secret_key"
        run: npm run test:integration

      - name: Run Frontend Unit Tests
        working-directory: apps/web
        run: npm test

      - name: Run End-to-End (E2E) Tests
        working-directory: tests/e2e
        env:
          JWT_SECRET: "ci_jwt_test_secret_key"
        run: npm test

      # Step 3: Production Build Verification
      - name: Build Backend NestJS
        working-directory: apps/api
        run: npm run build

      - name: Build Frontend Next.js PWA
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
        run: npm run build
