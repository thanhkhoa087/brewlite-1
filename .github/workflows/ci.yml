name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    name: Quality Gate (Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite_user
          POSTGRES_PASSWORD: brewlite_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci || npm install

      # Step 1: Linter Check
      - name: Run Linter (apps/api & apps/web)
        run: |
          npm run lint --if-present

      # Step 2: Unit & Integration Tests
      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://brewlite_user:brewlite_password@localhost:5432/brewlite_test"
          JWT_SECRET: "ci_jwt_test_secret_key"
        run: |
          cd apps/api
          npm test --if-present

      - name: Run Frontend Component Tests
        run: |
          cd apps/web
          npm test --if-present

      # Step 3: Production Build Verification
      - name: Build Backend NestJS
        run: |
          cd apps/api
          npm run build --if-present

      - name: Build Frontend Next.js PWA
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
        run: |
          cd apps/web
          npm run build --if-present
