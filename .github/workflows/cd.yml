name: Continuous Delivery & Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # 1. Quality Gate (Reuse CI Pipeline)
  quality-gate:
    name: 1. Quality Gate Verification
    uses: ./.github/workflows/ci.yml

  # 2. Package Docker Images & Push to GitHub Container Registry
  build-and-push:
    name: 2. Build & Push Docker Images
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Semantic / Commit Tag & Image Names
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          fi
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_api=${{ env.REGISTRY }}/${REPO_LOWER}/brewlite-api" >> "$GITHUB_OUTPUT"
          echo "image_web=${{ env.REGISTRY }}/${REPO_LOWER}/brewlite-web" >> "$GITHUB_OUTPUT"
          echo "Building images with tag: $TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.set_tag.outputs.image_api }}:${{ steps.set_tag.outputs.tag }}
            ${{ steps.set_tag.outputs.image_api }}:latest

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.set_tag.outputs.image_web }}:${{ steps.set_tag.outputs.tag }}
            ${{ steps.set_tag.outputs.image_web }}:latest

  # 3. Deploy to Production & Safe Migration
  deploy-production:
    name: 3. Deploy to Production & Safe Migration
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Prisma Migration
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Safe Database Migration
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm ci --omit=dev
            npx prisma migrate deploy --schema=./prisma/schema.prisma
          else
            echo "PROD_DATABASE_URL secret not configured; skipping live migration step."
          fi

      - name: Trigger PaaS Production Deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering Backend Render deploy hook for tag ${{ needs.build-and-push.outputs.image_tag }}..."
            curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "PROD_DEPLOY_HOOK secret not configured; skipping Backend deploy webhook."
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Frontend Vercel deploy hook..."
            curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK"
          fi

  # 4. Smoke Test & Automated Rollback Guard
  smoke-test:
    name: 4. Post-Deployment Smoke Test & Rollback
    needs: [deploy-production, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Cloud Service Warm-up
        run: sleep 15

      - name: Verify Health Endpoint (GET /health)
        id: health_check
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          TARGET_URL="${PROD_API_URL:-https://api-brewlite.onrender.com}"
          echo "Calling Health Check at ${TARGET_URL}/health..."

          MAX_RETRIES=5
          COUNT=0
          SUCCESS=0

          while [ $COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${TARGET_URL}/health" || echo "000")
            echo "Attempt $((COUNT+1)): Received HTTP Status $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              SUCCESS=1
              break
            fi
            COUNT=$((COUNT+1))
            sleep 10
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Smoke test FAILED (HTTP $HTTP_STATUS)! Triggering automated rollback..."
            exit 1
          fi
          echo "Smoke test PASSED! Production system is healthy."

      - name: Trigger Rollback on Failure
        if: failure()
        env:
          ROLLBACK_WEBHOOK_URL: ${{ secrets.PROD_ROLLBACK_HOOK }}
        run: |
          echo "CRITICAL: Health check failed. Rolling back to previous stable release tag (latest-stable)..."
          if [ -n "$ROLLBACK_WEBHOOK_URL" ]; then
            curl -fsSL -X POST "$ROLLBACK_WEBHOOK_URL"
          else
            echo "Manual rollback command: redeploy previous tag from ghcr.io/${GITHUB_REPOSITORY}/brewlite-api:<previous-sha>"
          fi
