name: Continuous Delivery & Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/brewlite-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/brewlite-web

jobs:
  # 1. Quality Gate
  quality-gate:
    name: 1. Quality Gate Verification
    uses: ./.github/workflows/ci.yml

  # 2. Package Docker Images & Push to Container Registry
  build-and-push:
    name: 2. Build & Push Docker Images
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Semantic / Commit Tag
        id: set_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=$(echo ${{ github.sha }} | cut -c1-7)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building with image tag: $TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.IMAGE_API }}:latest

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.set_tag.outputs.tag }}
            ${{ env.IMAGE_WEB }}:latest

  # 3. Deploy to Production & Safe Migration
  deploy-production:
    name: 3. Deploy to Production & Migration
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Safe Database Migration
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Executing Prisma Safe Migration on Production Database..."
          # npx prisma migrate deploy --schema=./apps/api/prisma/schema.prisma

      - name: Trigger PaaS Production Deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_HOOK }}
        run: |
          echo "Triggering cloud deploy webhook with tag ${{ needs.build-and-push.outputs.image_tag }}..."
          # curl -X POST "$DEPLOY_WEBHOOK_URL"

  # 4. Smoke Test & Automated Rollback Guard
  smoke-test:
    name: 4. Post-Deployment Smoke Test & Rollback
    needs: [deploy-production, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Cloud Pods Warm-up
        run: sleep 20

      - name: Verify Health Endpoint
        id: health_check
        run: |
          PROD_API_URL="${{ secrets.PROD_API_URL || 'https://api-brewlite.onrender.com' }}"
          echo "Calling Health Check at $PROD_API_URL/health..."
          
          MAX_RETRIES=5
          COUNT=0
          SUCCESS=0
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_API_URL/health" || echo "000")
            echo "Attempt $((COUNT+1)): Received HTTP Status $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              SUCCESS=1
              break
            fi
            COUNT=$((COUNT+1))
            sleep 10
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Smoke test FAILED! Triggering automated rollback..."
            exit 1
          fi
          echo "Smoke test PASSED! Production system is healthy."

      - name: Trigger Rollback on Failure
        if: failure()
        env:
          ROLLBACK_WEBHOOK_URL: ${{ secrets.PROD_ROLLBACK_HOOK }}
        run: |
          echo "CRITICAL: Health check failed. Rolling back to previous stable release tag..."
          # curl -X POST "$ROLLBACK_WEBHOOK_URL"
